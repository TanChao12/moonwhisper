.lx-inner{ position:relative; max-width:1080px; width:100%; margin:0 auto; }
.lx-title{ display:flex; align-items:flex-end; gap:28px; margin-bottom:10px; }
.lx-title .zh{ font-size:clamp(72px,12vw,140px); line-height:.9; font-weight:900; letter-spacing:.02em; }
.lx-title .en{ font-size:clamp(20px,3vw,34px); letter-spacing:.32em; color:var(--ivory-2); padding-bottom:10px; }
.lx-sub{ color:var(--silver); max-width:56ch; line-height:1.7; margin:18px 0 40px; }
.lx-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
.lx-card{ background:var(--ink); padding:26px 22px 22px; display:flex; flex-direction:column; gap:10px; min-height:220px; }
.lx-card h3{ font-family:var(--f-en); font-size:30px; font-weight:500; margin:0; letter-spacing:.04em; }
.lx-card .path{ font-family:var(--f-mono); font-size:12px; color:var(--jade); }
.lx-card p{ color:var(--silver); font-size:14px; line-height:1.6; margin:0; flex:1; }
.lx-card .acts{ display:flex; gap:8px; flex-wrap:wrap; }
.lx-btn{ appearance:none; border:1px solid var(--line-2); background:transparent; color:var(--ivory); padding:9px 14px; font-size:13px; letter-spacing:.06em; cursor:pointer; transition:background .2s, border-color .2s; }
.lx-btn:hover{ border-color:var(--ivory); background:rgba(236,230,214,.05); }
.lx-btn.primary{ background:var(--ivory); color:var(--ink); border-color:var(--ivory); font-weight:600; }
.lx-btn.primary:hover{ background:#fff; }
.lx-card.featured{ background:linear-gradient(180deg, rgba(216,179,106,.07), transparent 70%), var(--ink); }
.lx-foot{ margin-top:26px; font-size:12.5px; color:var(--silver-2); line-height:1.7; max-width:80ch; }
@media (max-width:900px){ .lx-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .lx-grid{ grid-template-columns:1fr; } .lx-card{ min-height:0; } .lx-title{ flex-direction:column; align-items:flex-start; gap:6px; } .lx-card[data-mode="play"]{ order:-1; } }

/* ---------------------------------------------------------------------
   MASTER STAGE (designed at 1920×1080, scaled to fit)
   --------------------------------------------------------------------- */
.ms-wrap{ position:relative; width:100%; height:100%; background:#000; overflow:hidden; }
.ms-stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden;
  background:radial-gradient(1400px 900px at 70% 30%, #111b33 0%, #0a1122 45%, #05080f 100%); color:var(--ivory); font-family:var(--f-ui); }
.ms-layer{ position:absolute; inset:0; }
.ms-canvas{ position:absolute; inset:0; width:1920px; height:1080px; }
.ms-clouds{ pointer-events:none; }
.ms-cloud{ position:absolute; border-radius:50%; filter:blur(40px); opacity:.5;
  background:radial-gradient(closest-side, rgba(142,135,196,.28), rgba(142,135,196,0)); }
.ms-moon{ position:absolute; left:960px; top:540px; width:560px; height:560px; margin:-280px 0 0 -280px; border-radius:50%; will-change:transform,opacity,filter; }
.moon-body{ position:absolute; inset:0; border-radius:50%;
  background:
    radial-gradient(circle at 34% 30%, rgba(255,255,255,.55), transparent 42%),
    radial-gradient(circle at 62% 58%, rgba(180,168,140,.28) 0 7%, transparent 8%),
    radial-gradient(circle at 40% 66%, rgba(180,168,140,.22) 0 5%, transparent 6%),
    radial-gradient(circle at 70% 34%, rgba(180,168,140,.18) 0 4%, transparent 5%),
    radial-gradient(circle at 28% 48%, rgba(180,168,140,.16) 0 3%, transparent 4%),
    radial-gradient(circle at 55% 82%, rgba(180,168,140,.14) 0 3.5%, transparent 4.5%),
    radial-gradient(circle at 50% 50%, #f6f0df 0%, #ece3c9 55%, #d9cca9 100%);
  box-shadow:0 0 80px 10px rgba(246,236,206,.28), 0 0 220px 60px rgba(216,179,106,.10), inset -30px -40px 90px rgba(120,104,70,.35); }
.moon-halo{ position:absolute; inset:-60%; border-radius:50%; background:radial-gradient(closest-side, rgba(236,226,196,.16), rgba(142,135,196,.06) 55%, transparent 72%); }
.ms-scene-host{ position:absolute; inset:0; }
.ms-scene{ position:absolute; inset:0; }

/* HUD */
.ms-hud{ position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .8s; }
.ms-hud.on{ opacity:1; }
.ms-hud-brand{ position:absolute; left:72px; top:56px; display:flex; align-items:baseline; gap:16px; }
.ms-hud-brand .zh{ font-size:34px; font-weight:900; }
.ms-hud-brand .en{ font-size:20px; letter-spacing:.34em; color:var(--ivory-2); }
.ms-hud-live{ position:absolute; right:72px; top:60px; font-family:var(--f-mono); font-size:22px; letter-spacing:.14em; color:var(--ivory-2); display:flex; gap:28px; align-items:center; }
.ms-hud-live b{ color:var(--ivory); font-weight:500; }
.dot-live{ display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--jade); box-shadow:0 0 0 0 rgba(127,200,191,.6); animation:pulse 2.2s infinite; margin-right:10px; vertical-align:middle; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(127,200,191,.55);} 70%{box-shadow:0 0 0 14px rgba(127,200,191,0);} 100%{box-shadow:0 0 0 0 rgba(127,200,191,0);} }
.ms-hud-track{ position:absolute; left:72px; bottom:52px; display:flex; gap:22px; align-items:center; font-family:var(--f-mono); font-size:18px; color:var(--silver); letter-spacing:.12em; }
.ms-hud-track .ph{ width:30px; height:30px; }
.ms-pause{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; background:rgba(5,8,15,.72); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .5s; }
.ms-pause.on{ opacity:1; }
.ms-pause .zh{ font-size:84px; font-weight:600; }
.ms-pause .mono{ font-size:22px; letter-spacing:.4em; color:var(--silver); }
.ms-fs{ position:absolute; right:24px; bottom:22px; z-index:5; font-family:var(--f-mono); font-size:12px; letter-spacing:.2em; background:transparent; color:var(--silver-2); border:1px solid transparent; padding:6px 10px; cursor:pointer; opacity:0; transition:opacity .4s; }
.ms-wrap:hover .ms-fs{ opacity:1; border-color:var(--line); }

/* shared master type */
.m-kicker{ font-family:var(--f-mono); font-size:24px; letter-spacing:.32em; color:var(--silver); }
.m-kicker.gold{ color:var(--gold); }
.m-kicker.jade{ color:var(--jade); }
.m-kicker.warn{ color:var(--alert); }
.m-huge-zh{ font-family:var(--f-zh); font-weight:900; line-height:1; }
.m-title-en{ font-family:var(--f-en); letter-spacing:.3em; font-weight:500; }
.m-serif{ font-family:var(--f-zh); font-weight:600; }
.split-ch{ display:inline-block; }

/* Waiting */
.sc-wait .wt-left{ position:absolute; left:140px; top:230px; }
.sc-wait .wt-zh{ font-size:300px; letter-spacing:.04em; }
.sc-wait .wt-en{ font-size:50px; margin-top:20px; color:var(--ivory-2); }
.sc-wait .wt-meta{ margin-top:64px; font-size:24px; color:var(--silver); line-height:1.9; letter-spacing:.06em; }
.sc-wait .wt-join{ position:absolute; right:150px; bottom:150px; display:flex; gap:48px; align-items:flex-end; }
.qr-box{ background:var(--ivory); padding:18px; border-radius:6px; width:268px; height:268px; display:flex; align-items:center; justify-content:center; }
.qr-box img,.qr-box canvas{ width:232px !important; height:232px !important; image-rendering:pixelated; }
.sc-wait .wt-count{ text-align:right; }
.sc-wait .wt-count .n{ font-family:var(--f-en); font-size:180px; line-height:.85; font-weight:500; }
.sc-wait .wt-count .l{ font-family:var(--f-mono); font-size:22px; letter-spacing:.3em; color:var(--silver); margin-top:18px; }
.sc-wait .wt-scan{ font-size:34px; font-family:var(--f-zh); margin-bottom:14px; }

/* Intro */
.sc-intro .in-title{ position:absolute; left:0; right:0; top:760px; text-align:center; }
.sc-intro .in-zh{ font-size:150px; letter-spacing:.3em; padding-left:.3em; }
.sc-intro .in-en{ font-size:40px; margin-top:22px; color:var(--ivory-2); }
.sc-intro .in-line{ position:absolute; left:0; right:0; top:760px; text-align:center; font-family:var(--f-en); font-style:italic; font-size:64px; color:var(--ivory); }
.sc-intro .in-sys{ position:absolute; left:240px; top:300px; font-family:var(--f-mono); }
.sc-intro .in-sys .srow{ font-size:54px; letter-spacing:.08em; line-height:1.6; }
.sc-intro .in-sys .srow .ok{ color:var(--jade); }
.sc-intro .in-sys .head{ font-size:26px; letter-spacing:.5em; color:var(--silver); margin-bottom:30px; }
.sc-intro .in-sys .calm{ font-family:var(--f-en); font-style:italic; font-size:48px; color:var(--ivory-2); margin-top:40px; letter-spacing:0; }
.sc-intro .in-alert{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.sc-intro .in-alert .a1{ font-family:var(--f-mono); font-size:34px; letter-spacing:.6em; color:var(--alert); }
.sc-intro .in-alert .a2{ font-family:var(--f-mono); font-size:150px; font-weight:500; letter-spacing:.04em; margin:26px 0; }
.sc-intro .in-alert .a3{ font-family:var(--f-mono); font-size:40px; letter-spacing:.3em; color:var(--ivory-2); }
.sc-intro .in-proj{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.sc-intro .in-proj .p1{ font-family:var(--f-en); font-size:210px; font-weight:500; letter-spacing:.1em; }
.sc-intro .in-proj .p2{ font-family:var(--f-mono); font-size:34px; letter-spacing:.4em; color:var(--gold); margin-top:14px; }
.glitch-bar{ position:absolute; left:0; right:0; height:14px; background:rgba(236,230,214,.8); mix-blend-mode:difference; opacity:0; }
.scanlines{ position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px); opacity:0; }

/* Group chat */
.sc-chat .ch-panel{ position:absolute; left:140px; top:150px; width:1060px; height:800px; border:1px solid var(--line-2); background:linear-gradient(180deg, rgba(12,20,38,.88), rgba(6,9,16,.9)); display:flex; flex-direction:column; }
.sc-chat .ch-head{ padding:26px 40px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
.sc-chat .ch-head .zh{ font-size:36px; font-weight:600; }
.sc-chat .ch-head .mono{ font-size:18px; color:var(--silver); letter-spacing:.2em; }
.sc-chat .ch-body{ flex:1; padding:22px 40px 30px; display:flex; flex-direction:column; justify-content:flex-end; gap:16px; overflow:hidden; }
.chat-msg{ display:grid; grid-template-columns:120px 1fr; column-gap:22px; align-items:start; }
.chat-msg .who{ font-size:20px; color:var(--silver); padding-top:12px; text-align:right; line-height:1.3; }
.chat-msg .time{ font-family:var(--f-mono); font-size:16px; color:var(--silver-2); display:block; margin-top:4px; }
.chat-msg .bubble{ justify-self:start; font-size:38px; line-height:1.4; padding:14px 26px; background:rgba(236,230,214,.07); border:1px solid var(--line); border-radius:4px 22px 22px 22px; font-family:var(--f-ui); }
.chat-typing{ display:flex; gap:10px; padding:18px 26px; background:rgba(236,230,214,.05); border-radius:4px 22px 22px 22px; justify-self:start; }
.chat-typing i{ width:12px; height:12px; border-radius:50%; background:var(--silver); display:block; animation:typing 1.2s infinite; }
.chat-typing i:nth-child(2){ animation-delay:.15s } .chat-typing i:nth-child(3){ animation-delay:.3s }
@keyframes typing{ 0%,60%,100%{ opacity:.25; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-6px);} }
.sc-chat .ch-side{ position:absolute; left:1290px; top:170px; width:520px; }
.sc-chat .ch-side .who-list{ margin-top:30px; display:flex; flex-direction:column; gap:14px; }
.sc-chat .ch-side .who-list div{ font-size:28px; display:flex; align-items:center; gap:14px; color:var(--ivory-2); transition:color .4s; }
.sc-chat .ch-side .who-list div::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--silver-2); transition:background .4s, box-shadow .4s; }
.sc-chat .ch-side .who-list div.hot{ color:var(--ivory); }
.sc-chat .ch-side .who-list div.hot::before{ background:var(--alert); box-shadow:0 0 12px var(--alert); }
.sc-chat .ch-sys{ position:absolute; left:1290px; bottom:130px; width:520px; }
.sc-chat .ch-sys .s1{ font-family:var(--f-mono); font-size:24px; letter-spacing:.2em; color:var(--alert); line-height:1.6; }
.sc-chat .ch-sys .s2{ font-family:var(--f-en); font-size:66px; line-height:1; margin-top:22px; }
.sc-chat .ch-sys .s2 small{ display:block; font-family:var(--f-mono); font-size:22px; letter-spacing:.3em; color:var(--gold); margin-top:14px; }

/* Case */
.sc-case .cs-left{ position:absolute; left:140px; top:150px; width:820px; }
.sc-case .cs-code{ font-family:var(--f-en); font-size:40px; letter-spacing:.34em; color:var(--gold); }
.sc-case .cs-title{ font-size:124px; line-height:1.12; margin:26px 0 18px; }
.sc-case .cs-titleen{ font-family:var(--f-en); font-style:italic; font-size:40px; color:var(--ivory-2); letter-spacing:.06em; }
.sc-case .cs-brief{ margin-top:52px; display:flex; flex-direction:column; gap:14px; }
.sc-case .cs-brief div{ font-family:var(--f-zh); font-size:44px; line-height:1.4; color:var(--ivory); }
.sc-case .cs-brief div.dim{ color:var(--ivory-2); }
.sc-case .cs-q{ position:absolute; left:140px; right:140px; bottom:110px; display:flex; align-items:center; gap:40px; padding-top:34px; border-top:1px solid var(--line-2); }
.sc-case .cs-q .qz{ font-family:var(--f-zh); font-size:54px; font-weight:600; flex:1; }
.sc-case .cs-q .qn{ font-family:var(--f-mono); font-size:22px; letter-spacing:.24em; color:var(--jade); text-align:right; line-height:1.6; }
.sc-case .cs-ev{ position:absolute; left:1040px; top:150px; width:740px; height:640px; }
.ev-label{ font-family:var(--f-mono); font-size:20px; letter-spacing:.3em; color:var(--silver); margin-bottom:18px; }
.ev-frame{ border:1px solid var(--line-2); background:rgba(6,9,16,.65); padding:34px; position:relative; }
.ev-big{ font-family:var(--f-en); font-size:120px; line-height:1; color:var(--alert); }
.ev-row{ display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:22px; padding:14px 0; border-bottom:1px solid var(--line); color:var(--ivory-2); letter-spacing:.06em; }
.ev-row b{ font-weight:500; color:var(--alert); }
.ev-row b.ok{ color:var(--jade); }
.ev-file{ display:flex; align-items:center; gap:30px; }
.ev-file .ico{ width:120px; height:150px; border:2px solid var(--ivory-2); position:relative; flex:none; }
.ev-file .ico::after{ content:"PDF"; position:absolute; left:12px; bottom:12px; font-family:var(--f-mono); font-size:22px; color:var(--alert); }
.ev-file .ico::before{ content:""; position:absolute; right:-2px; top:-2px; width:36px; height:36px; background:var(--night); border-left:2px solid var(--ivory-2); border-bottom:2px solid var(--ivory-2); }
.ev-file .name{ font-family:var(--f-mono); font-size:30px; line-height:1.4; word-break:break-all; color:var(--ivory); }
.ev-versions{ margin-top:30px; font-family:var(--f-mono); font-size:22px; line-height:2; color:var(--silver-2); }
.ev-versions s{ color:var(--silver-2); }
.ev-tables{ display:grid; grid-template-columns:repeat(4,1fr); gap:34px 30px; margin-top:20px; }
.ev-table{ width:120px; height:120px; border-radius:50%; border:2px dashed var(--line-2); display:flex; align-items:center; justify-content:center; font-family:var(--f-mono); font-size:38px; color:var(--silver); position:relative; }
.ev-table.vip{ border-color:rgba(216,179,106,.5); }
.ev-check{ display:flex; flex-direction:column; gap:0; }
.ev-check div{ display:flex; gap:22px; align-items:center; font-size:30px; padding:13px 0; border-bottom:1px solid var(--line); }
.ev-check div .bx{ width:28px; height:28px; border:2px solid var(--silver-2); flex:none; position:relative; }
.ev-check div.done .bx{ border-color:var(--jade); background:rgba(127,200,191,.2); }
.ev-check div.done .bx::after{ content:""; position:absolute; left:8px; top:2px; width:8px; height:16px; border:solid var(--jade); border-width:0 3px 3px 0; transform:rotate(45deg); }
.ev-check div .st{ margin-left:auto; font-family:var(--f-mono); font-size:18px; letter-spacing:.2em; color:var(--alert); }
.ev-check div.done .st{ color:var(--jade); }
.ev-map svg{ width:100%; height:auto; overflow:visible; }
.ev-msg{ height:100%; display:flex; flex-direction:column; justify-content:center; }
.ev-msg .quote{ font-family:var(--f-en); font-style:italic; font-size:74px; line-height:1.15; }
.ev-msg .cursor{ display:inline-block; width:4px; height:64px; background:var(--gold); vertical-align:middle; margin-left:10px; animation:blink 1s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:0 } }
.ev-msg .ghosts{ margin-top:60px; display:flex; gap:40px; font-family:var(--f-zh); font-size:40px; color:var(--silver-2); }

/* Technical failure */
.sc-fail{ background:#020306; }
.sc-fail .fl-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.sc-fail .fl-err{ font-family:var(--f-mono); font-size:120px; letter-spacing:.06em; color:var(--alert); }
.sc-fail .fl-voice{ font-family:var(--f-zh); font-size:80px; margin-top:40px; color:var(--ivory); }
.sc-fail .fl-lost{ font-family:var(--f-mono); font-size:30px; letter-spacing:.6em; color:var(--silver); margin-top:40px; }
.sc-fail .fl-wave{ position:absolute; left:0; right:0; top:170px; height:220px; }
.sc-fail .fl-q{ position:absolute; left:0; right:0; bottom:110px; text-align:center; font-family:var(--f-zh); font-size:60px; font-weight:600; }
.sc-fail .fl-q small{ display:block; font-family:var(--f-mono); font-size:22px; letter-spacing:.3em; color:var(--jade); margin-top:18px; font-weight:400; }
.sc-fail .noise{ position:absolute; inset:0; opacity:.08; background-image:repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px); mix-blend-mode:screen; }

/* Voting / result */
.sc-vote .vt-head{ position:absolute; left:140px; top:140px; right:560px; }
.sc-vote .vt-head .k{ display:flex; gap:24px; align-items:center; }
.sc-vote .vt-q{ font-family:var(--f-zh); font-size:64px; font-weight:600; line-height:1.3; margin-top:26px; }
.sc-vote .vt-q.en-q{ font-family:var(--f-en); font-weight:500; letter-spacing:.06em; }
.sc-vote .vt-bars{ position:absolute; left:140px; right:560px; top:430px; display:flex; flex-direction:column; gap:30px; }
.vbar{ display:grid; grid-template-columns:78px 1fr 180px; align-items:center; column-gap:28px; }
.vbar .lt{ width:70px; height:70px; border:1px solid var(--line-2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--f-en); font-size:38px; }
.vbar .mid{ position:relative; }
.vbar .lab{ font-size:40px; font-family:var(--f-zh); margin-bottom:12px; }
.vbar .track{ height:14px; background:rgba(236,230,214,.07); position:relative; overflow:hidden; }
.vbar .fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg, rgba(236,230,214,.5), var(--ivory)); }
.vbar .pct{ font-family:var(--f-en); font-size:78px; text-align:right; line-height:1; }
.vbar .pct small{ font-size:36px; color:var(--ivory-2); }
.vbar.win .fill{ background:linear-gradient(90deg, rgba(216,179,106,.5), var(--gold)); }
.vbar.win .lt{ border-color:var(--gold); color:var(--gold); }
.vbar.win .pct{ color:var(--gold); }
.vbar.lose{ opacity:.28; transition:opacity .6s; }
.compact .vbar .lab{ font-size:34px; margin-bottom:8px; }
.compact .vbar .pct{ font-size:64px; }
.compact.vt-bars{ gap:20px; }
.sc-vote .vt-side{ position:absolute; right:140px; top:180px; width:340px; display:flex; flex-direction:column; align-items:center; gap:34px; }
.cd-ring{ position:relative; width:300px; height:300px; }
.cd-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.cd-ring .n{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:var(--f-en); font-size:120px; line-height:1; }
.cd-ring .n small{ font-family:var(--f-mono); font-size:18px; letter-spacing:.3em; color:var(--silver); margin-top:10px; }
.sc-vote .vt-resp{ text-align:center; }
.sc-vote .vt-resp .n{ font-family:var(--f-en); font-size:96px; line-height:1; }
.sc-vote .vt-resp .l{ font-family:var(--f-mono); font-size:18px; letter-spacing:.28em; color:var(--silver); margin-top:12px; }

.pg-moon{ width:190px; height:190px; margin:12px auto 18px; display:block; }
.pg-stats{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin:18px 0; }
.pg-stats div{ background:var(--ink); padding:16px; }
.pg-stats b{ display:block; font-family:var(--f-en); font-size:40px; font-weight:500; line-height:1; }
.pg-stats span{ font-family:var(--f-mono); font-size:10.5px; letter-spacing:.18em; color:var(--silver); }
.pg-list div{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:15px; }
.pg-list div .s{ font-family:var(--f-mono); font-size:11px; letter-spacing:.16em; color:var(--silver-2); }
.pg-list div.on .s{ color:var(--gold); }

/* recruitment (participant) */
.rc-dept{ display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left; background:rgba(236,230,214,.03); border:1px solid var(--line-2); color:var(--ivory); padding:14px; cursor:pointer; margin-bottom:10px; transition:border-color .2s, background .2s; }
.rc-dept svg{ width:28px; height:28px; flex:none; color:var(--silver); margin-top:2px; }
.rc-dept .nm{ font-family:var(--f-zh); font-size:18px; font-weight:600; }
.rc-dept .nm.latin{ font-family:var(--f-en); font-style:italic; font-weight:500; font-size:20px; }
.rc-dept .ds{ font-size:13px; color:var(--ivory-2); line-height:1.55; margin-top:4px; }
.rc-dept.sel{ border-color:var(--gold); background:rgba(216,179,106,.08); }
.rc-dept.sel svg{ color:var(--gold); }
.rc-form .form-label{ font-family:var(--f-mono); font-size:11px; letter-spacing:.2em; color:var(--silver); margin-bottom:6px; }
.rc-form .form-control,.rc-form .form-select{ background:rgba(236,230,214,.04); border:1px solid var(--line-2); color:var(--ivory); border-radius:0; padding:12px 14px; font-size:16px; }
.rc-form .form-control:focus,.rc-form .form-select:focus{ background:rgba(236,230,214,.06); border-color:var(--gold); box-shadow:none; color:var(--ivory); }
.rc-form .form-control::placeholder{ color:var(--silver-2); }
.rc-form .form-select option{ background:var(--night); }
.rc-form .invalid-feedback{ color:var(--alert); }
.rc-form .was-validated .form-control:invalid, .rc-form .form-control.is-invalid{ border-color:var(--alert); background-image:none; }
.rc-form .was-validated .form-control:valid{ border-color:var(--line-2); background-image:none; }

/* phone-only outer frame when standalone on large screens */
@media (min-width:700px){
  .pp-shell{ border-left:1px solid var(--line); border-right:1px solid var(--line); }
  .pp-main{ padding:30px 34px 34px; }
  .p-h1{ font-size:40px; }
  .lp-submit{ margin:22px -34px -34px; padding:16px 34px 24px; bottom:-34px; }
}

/* ---------------------------------------------------------------------
   HOST PANEL (Bootstrap-based, functional)
   --------------------------------------------------------------------- */
.hc{ min-height:100%; background:#0a0e18; color:var(--ivory); padding:22px 0 60px; }
.hc .container-fluid{ max-width:1320px; }
.hc h1{ font-family:var(--f-en); font-size:30px; font-weight:500; letter-spacing:.06em; margin:0; }
.hc .sub{ font-family:var(--f-mono); font-size:12px; color:var(--silver); letter-spacing:.14em; }
.hc .card{ background:#0f1522; border:1px solid var(--line); border-radius:4px; color:var(--ivory); }
.hc .card-header{ background:transparent; border-bottom:1px solid var(--line); font-family:var(--f-mono); font-size:12px; letter-spacing:.2em; color:var(--silver); padding:12px 16px; }
.hc .stat .v{ font-family:var(--f-en); font-size:44px; line-height:1; }
.hc .stat .k{ font-family:var(--f-mono); font-size:11px; letter-spacing:.18em; color:var(--silver); margin-top:6px; }
.hc .state-pill{ font-family:var(--f-mono); font-size:26px; letter-spacing:.08em; }
.hc .btn{ border-radius:3px; font-family:var(--f-mono); letter-spacing:.08em; font-size:13px; padding:10px 12px; }
.hc .btn-outline-light{ border-color:var(--line-2); color:var(--ivory); }
.hc .btn-outline-light:hover{ background:rgba(236,230,214,.08); color:#fff; border-color:var(--ivory-2); }
.hc .btn-advance{ background:var(--gold); color:#141008; border:0; font-size:17px; padding:18px; font-weight:600; letter-spacing:.14em; }
.hc .btn-advance:hover{ background:#e6c47f; color:#141008; }
.hc .btn-advance small{ display:block; font-size:11.5px; letter-spacing:.12em; font-weight:500; opacity:.75; margin-top:4px; }
.hc .btn-demo.active{ background:var(--jade); color:#07130f; border-color:var(--jade); }
.hc .tally div{ display:grid; grid-template-columns:22px 1fr 44px 52px; gap:10px; align-items:center; font-size:13px; padding:5px 0; }
.hc .tally .tb{ height:6px; background:rgba(236,230,214,.08); position:relative; }
.hc .tally .tb i{ position:absolute; inset:0 auto 0 0; background:var(--ivory-2); }
.hc .tally div.ok .tb i{ background:var(--gold); }
.hc .tally .n{ font-family:var(--f-mono); color:var(--silver); text-align:right; }
.hc .form-select,.hc .form-control{ background:#0a0e18; border-color:var(--line-2); color:var(--ivory); border-radius:3px; font-size:13px; }
.hc textarea.form-control{ font-family:var(--f-mono); font-size:11.5px; }
.hc .table{ --bs-table-bg:transparent; --bs-table-color:var(--ivory); --bs-table-border-color:var(--line); font-size:13px; }
.hc .kbd{ font-family:var(--f-mono); font-size:11px; border:1px solid var(--line-2); padding:1px 6px; color:var(--silver); }
.hc .log{ font-family:var(--f-mono); font-size:11.5px; color:var(--silver); max-height:150px; overflow:auto; }
.hc .mini-link{ color:var(--jade); text-decoration:none; font-family:var(--f-mono); font-size:12px; }
.hc .flow{ display:flex; flex-wrap:wrap; gap:4px; }
.hc .flow span{ font-family:var(--f-mono); font-size:10.5px; padding:3px 6px; border:1px solid var(--line); color:var(--silver-2); }
.hc .flow span.on{ border-color:var(--gold); color:var(--gold); }
.hc .flow span.done{ color:var(--silver); }

/* ---------------------------------------------------------------------
   REHEARSAL (all three in one tab)
   --------------------------------------------------------------------- */
.rh{ height:100%; display:grid; grid-template-columns:minmax(0,1fr) 400px; grid-template-rows:auto minmax(0,1fr); gap:14px; padding:14px; background:#04060b; }
.rh-bar{ grid-column:1 / -1; display:flex; align-items:center; gap:16px; font-family:var(--f-mono); font-size:12px; color:var(--silver); letter-spacing:.14em; }
.rh-bar a{ color:var(--jade); text-decoration:none; }
.rh-left{ display:grid; grid-template-rows:auto minmax(0,1fr); gap:14px; min-height:0; }
.rh-master{ aspect-ratio:16/9; width:100%; max-height:62vh; margin:0 auto; border:1px solid var(--line); }
.rh-host{ overflow:auto; border:1px solid var(--line); min-height:0; }
.rh-host .hc{ padding-top:12px; }
.rh-phone{ border:1px solid var(--line-2); border-radius:34px; overflow:hidden; position:relative; height:100%; max-height:844px; width:100%; max-width:390px; justify-self:center; box-shadow:0 0 0 8px #0c0f16, 0 30px 80px rgba(0,0,0,.6); }
.rh-phone .pp{ height:100%; }
@media (max-width:1100px){ .rh{ grid-template-columns:1fr; grid-template-rows:auto auto auto; height:auto; } .rh-left{ grid-template-rows:auto auto; } .rh-host{ max-height:none; } .rh-phone{ height:760px; } }

                    const batch = Math.min(target - total, Math.max(1, Math.round(n * (0.02 + Math.random() * 0.07))));
                    for (let i = 0; i < batch; i++) {
                        const conv = Math.min(1, (total + i) / Math.max(1, target));
                        let r = Math.random(), pick = cs.options[0].k;

                        const sum = w.reduce((a, b) => a + b.w, 0);
                        for (const x of w) { r -= x.w / sum; if (r <= 0) { pick = x.k; break; } }
                        cur[pick] = (cur[pick] || 0) + 1;
                    }
                    Store.patchSim(s2 => ({ simVotes: Object.assign({}, s2.simVotes, { [c.currentCase]: cur }) }));
                }

    function frame() {
      if (!run) return;
      g.clearRect(0, 0, W, H);
      for (const p of pts) {
        p.tw += .02 * speed; p.y += p.vy * speed; p.x += p.vx * speed;
        if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
        if (p.x < -5) p.x = W + 5; if (p.x > W + 5) p.x = -5;
        const a = p.a * (.6 + .4 * Math.sin(p.tw)) * alpha;
        g.fillStyle = `rgba(${tint[0]},${tint[1]},${tint[2]},${a.toFixed(3)})`;
        g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

      mood(m) {
        if (m === 'calm') { speed = 1; tint = [236, 230, 214]; alpha = 1; }
        if (m === 'dim') { speed = .4; alpha = .35; }

    function unlockHTML(s, cs) {

    /* recruitment */
    function recruitHTML(s) {
      const m = me(s), reg = s.registrations[m.id];
      if (reg && rec.step !== 'form') rec.step = 'done';

              <div class="col-5"><label class="form-label" for="rfYear">YEAR · 年级</label><select class="form-select" id="rfYear" required>${['1', '2', '3', '4'].map(y => `<option ${String(r.year || '1') === y ? 'selected' : ''}>${y}</option>`).join('')}</select></div></div>

            <div class="mb-4"><label class="form-label" for="rfWhy">WHY THIS DEPARTMENT? (OPTIONAL) · 为什么想加入？</label><textarea class="form-control" id="rfWhy" rows="3" maxlength="300">${E(r.why || '')}</textarea></div>

        <div class="p-h1" style="font-family:var(--f-en);font-weight:500;font-size:34px">The investigation is complete.</div>
        <div class="p-body">But your story doesn't have to end here. 但你的故事，不必在这里结束。</div>
        <div class="p-rule"></div><div class="p-kick" style="margin-bottom:14px">WHICH DEPARTMENT WOULD YOU LIKE TO EXPLORE? · PICK UP TO 2</div>
        ${MW.DEPT_ORDER.map(id => { const d = MW.DEPTS[id]; return `<button type="button" class="rc-dept ${rec.picks.includes(id) ? 'sel' : ''}" data-id="${id}" aria-pressed="${rec.picks.includes(id)}">${MW.icon(d.icon)}<span><span class="nm ${d.latin ? 'latin' : ''}">${E(d.zh)}</span><span class="ds d-block">${E(d.recruit)}</span></span></button>`; }).join('')}
        <div class="lp-submit"><button type="button" class="p-btn gold join" ${rec.picks.length ? '' : 'disabled'}>I WANT TO JOIN THE STORY</button></div>`;
    }

    function wireLive(s, cs) {
      const main = $('.pp-main'); const c = s.control;
      if (c.status === 'VOTING') {
        main.querySelectorAll('.lp-opt').forEach(b => b.onclick = () => {
          sel = b.dataset.k;
          main.querySelectorAll('.lp-opt').forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-checked', x === b); });
          main.querySelector('.sub').disabled = false;
          gsap.fromTo(b, { scale: .98 }, { scale: 1, duration: .3, ease: 'back.out(3)' });
        });
        const sub = main.querySelector('.sub');
        if (sub) sub.onclick = () => {
          if (!sel) return;
          if (MW.Me.vote(cs.id, sel)) { justVoted = true; sub.disabled = true; sub.textContent = 'SENDING…'; setTimeout(() => { liveKey = null; renderLive(MW.Store.get()); animateCheck(); }, 120); }
        };
      }
      if (c.status === 'UNLOCK') {
        const cont = main.querySelector('.cont'); if (cont) cont.onclick = () => { unlockContinued[cs.id] = true; renderLive(MW.Store.get()); };
        const vf = main.querySelector('.vf'); if (vf) vf.onclick = () => { setTab('files'); openSheet(cs.department); };
      }
      if (c.status === 'COMPLETED') {
        main.querySelectorAll('.rc-dept').forEach(b => b.onclick = () => {
          const id = b.dataset.id, i = rec.picks.indexOf(id);
          if (i >= 0) rec.picks.splice(i, 1); else { rec.picks.push(id); if (rec.picks.length > 2) rec.picks.shift(); }
          main.querySelectorAll('.rc-dept').forEach(x => { const on = rec.picks.includes(x.dataset.id); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
          main.querySelector('.join').disabled = !rec.picks.length;
        });
        const j = main.querySelector('.join'); if (j) j.onclick = () => { rec.step = 'form'; renderLive(MW.Store.get()); main.scrollTop = 0; };
        const bk = main.querySelector('.back'); if (bk) bk.onclick = () => { rec.step = 'pick'; renderLive(MW.Store.get()); };
        const ed = main.querySelector('.edit'); if (ed) ed.onclick = () => { const r = MW.Store.get().registrations[me(MW.Store.get()).id]; rec.picks = (r && r.depts) || rec.picks; rec.step = 'form'; renderLive(MW.Store.get()); };
        const f = main.querySelector('.rc-form');
        if (f) f.onsubmit = e => {
          e.preventDefault(); f.classList.add('was-validated');
          if (!f.checkValidity()) { const bad = f.querySelector(':invalid'); bad && bad.focus(); return; }
          MW.Me.register({ name: $('#rfName').value.trim(), matric: $('#rfMatric').value.trim().toUpperCase(), faculty: $('#rfFac').value, year: $('#rfYear').value, phone: $('#rfPhone').value.trim(), why: $('#rfWhy').value.trim(), depts: rec.picks.slice() });
          rec.step = 'done'; setTimeout(() => { renderLive(MW.Store.get()); main.scrollTop = 0; }, 60);
        };
      }
    }
    function animateCheck() {
      const ck = root.querySelector('.lp-recv .ck'); if (!ck) return;
      const c = ck.querySelector('circle'), p = ck.querySelector('path');
      gsap.fromTo(c, { strokeDasharray: 264, strokeDashoffset: 264 }, { strokeDashoffset: 0, duration: .7, ease: 'power2.out' });
      gsap.fromTo(p, { strokeDasharray: 60, strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: .4, delay: .5, ease: 'power2.out' });
      try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    }

    /* periodic updates inside the live panel (sync to the big screen's clock) */
    function liveTick() {
      if (view !== 'terminal' || tab !== 'case') return;
      const s = MW.Store.get(), c = s.control, main = $('.pp-main'); if (!main) return;
      const el = MW.elapsed(c);
      if (c.status === 'INTRO' || c.status === 'FINAL') main.querySelectorAll('[data-at]').forEach(d => d.classList.toggle('on', +d.dataset.at <= el));
      if (c.status === 'RESULT' && c.revealed && MW.caseById(c.currentCase).final) { const e2 = MW.elapsed(c, c.revealedAt); main.querySelectorAll('.fr [data-at]').forEach(d => d.classList.toggle('on', +d.dataset.at <= e2)); }
      if (c.status === 'CHAT') {
        let changed = false;
        main.querySelectorAll('.lp-chat [data-at]').forEach(d => { const on = +d.dataset.at <= el; if (on && d.style.display === 'none') { d.style.display = ''; gsap.from(d, { opacity: 0, y: 8, duration: .4 , clearProps: 'opacity,transform' }); changed = true; } });
        if (changed) main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' });
      }
      if (c.status === 'VOTING') {
        const rem = MW.remaining(c), ts = main.querySelector('.ts'), tb = main.querySelector('.tb i');
        if (ts) { ts.textContent = rem == null ? '—' : rem + 's'; tb.style.width = rem == null ? '100%' : (rem / (c.voteDuration || 1) * 100) + '%'; tb.style.background = rem != null && rem <= 5 ? 'var(--gold)' : ''; }
        const rr = main.querySelector('.rr'); if (rr) rr.textContent = MW.tally(s, c.currentCase).total + ' / ' + MW.connected(s);
      }
      const cn = main.querySelector('.cn'); if (cn) cn.textContent = MW.connected(s);
    }

    /* ---------- static tabs ---------- */
    function renderStatic(s) {
      const main = $('.pp-main'), c = s.control;
      if (tab === 'messages') {
        const items = [];
        const r = RANK[c.status];
        if (r >= 1) items.push({ sys: true, t: 'PROJECT 071 · INVESTIGATION PROTOCOL ACTIVATED' });
        if (r >= 2) {
          const sch = MW.chatSchedule(), el = r === 2 ? MW.elapsed(c) : 1e9;
          sch.msgs.forEach(x => { if (x.at <= el) items.push({ w: x.msg.t + ' · ' + x.msg.from, t: x.msg.text }); });
          if (sch.sysAt <= el) items.push({ sys: true, t: 'MULTIPLE DEPARTMENT ANOMALIES DETECTED' });
        }
        if (r >= 3) {
          for (let n = 1; n <= Math.min(c.currentCase, 8); n++) {
            const cs = MW.caseById(n);
            items.push({ sys: true, gold: true, t: (cs.final ? 'FINAL CASE' : 'CASE FILE ' + MW.pad(n)) + ' OPENED' });
            if (cs.department && c.departmentsUnlocked.includes(cs.department)) items.push({ sys: true, gold: true, t: 'DEPARTMENT UNLOCKED · ' + MW.DEPTS[cs.department].zh });
          }
        }
        if (r >= 4) items.push({ sys: true, t: 'NO SINGLE CULPRIT FOUND' });
        main.innerHTML = `<div class="p-kick">CHANNEL LOG</div><div class="p-h1" style="font-size:24px">消息记录</div><div class="p-rule" style="margin:14px 0 18px"></div>
          ${items.length ? `<div class="lp-chat">${items.map(i => i.sys ? `<div class="m sys ${i.gold ? 'gold' : ''}"><span class="b">${E(i.t)}</span></div>` : `<div class="m"><span class="w">${E(i.w)}</span><span class="b">${E(i.t)}</span></div>`).join('')}</div>`
            : `<div class="p-body">No messages yet. When the investigation starts, intercepted messages and system alerts collect here.</div>`}`;
      }
      if (tab === 'files') {
        main.innerHTML = `<div class="p-kick">DEPARTMENT FILES · ${c.departmentsUnlocked.length} / 07</div><div class="p-h1" style="font-size:24px">部门档案</div><div class="p-body" style="font-size:13.5px">Each solved case unlocks one department's file.</div><div class="p-rule" style="margin:14px 0 4px"></div>
          ${CASE_DEPTS.map(({ caseId, dept: d }) => c.departmentsUnlocked.includes(d.id)
            ? `<button type="button" class="fl-item" data-id="${d.id}">${MW.icon(d.icon)}<span class="t"><span class="a d-block ${d.latin ? 'latin' : ''}">${E(d.zh)}</span><span class="b d-block">${E(d.en)}</span></span>${MW.icon('files')}</button>`
            : `<div class="fl-item locked">${MW.icon('lock')}<span class="t"><span class="a d-block"><span class="redact" style="width:${60 + caseId * 11}px"></span></span><span class="b d-block">CLASSIFIED · UNLOCKS IN CASE ${MW.pad(caseId)}</span></span></div>`).join('')}`;
        main.querySelectorAll('.fl-item[data-id]').forEach(b => b.onclick = () => openSheet(b.dataset.id));
      }
      if (tab === 'progress') {
        const n = c.departmentsUnlocked.length, m = me(s);
        let answered = 0, correct = 0, judged = 0;
        MW.CASES.forEach(cs => { const v = MW.Me.myVote(s, cs.id); if (v) answered++; if (cs.department && c.departmentsUnlocked.includes(cs.department)) { judged++; if (v === cs.correct) correct++; } });
        main.innerHTML = `<div class="p-kick">INVESTIGATOR ${E(m.id)} · ${E(m.name)}</div><div class="p-h1" style="font-size:24px">月相进度</div>
          <div class="pg-moon">${MW.phaseSVG(n / 7, 190)}</div>
          <div class="text-center p-body" style="font-size:13px">The moon fills as departments are found. ${n === 7 ? '月亮升起来了。' : `${7 - n} more to go.`}</div>
          <div class="pg-stats"><div><b>${n}<small style="font-size:18px;color:var(--silver)">/7</small></b><span>DEPARTMENTS</span></div><div><b>${correct}<small style="font-size:18px;color:var(--silver)">/${judged}</small></b><span>CORRECT CALLS</span></div><div><b>${answered}</b><span>RESPONSES SENT</span></div><div><b>${MW.connected(s)}</b><span>INVESTIGATORS LIVE</span></div></div>
          <div class="pg-list">${CASE_DEPTS.map(({ caseId, dept: d }) => { const on = c.departmentsUnlocked.includes(d.id); return `<div class="${on ? 'on' : ''}"><span>${MW.pad(caseId)} · ${on ? MW.deptName(d) : '？？？'}</span><span class="s">${on ? 'UNLOCKED' : c.currentCase === caseId && RANK[c.status] === 3 ? 'IN PROGRESS' : 'LOCKED'}</span></div>`; }).join('')}</div>`;
      }
    }
    function openSheet(id) {
      const d = MW.DEPTS[id], main = $('.pp-main');
      const sh = MW.el(`<div class="fl-sheet" role="dialog" aria-label="${E(d.zh)}">
        <button type="button" class="p-btn ghost x" style="width:auto;padding:9px 14px;font-size:12px">← ALL FILES</button>
        <div class="lp-unlock" style="margin-top:12px"><div class="dmoon" style="width:110px;height:110px">${MW.moonMini()}</div>
          <div class="nm ${d.latin ? 'latin' : ''}">${E(d.zh)}</div><div class="en">${E(d.en)}</div>
          <div class="kw">${d.keywords.map(k => `<span>${E(k)}</span>`).join('')}</div><div class="ds">${E(d.desc)}</div>
          <div class="p-body" style="font-size:14px">${E(d.recruit)}</div></div></div>`);
      main.appendChild(sh); sheet = id; main.scrollTop = 0;
      gsap.from(sh, { opacity: 0, y: 20, duration: .4, ease: 'power2.out' , clearProps: 'opacity,transform' });
      sh.querySelector('.x').onclick = () => { sheet = null; sh.remove(); };
    }

    /* ---------- state → view ---------- */
    function render(s) {
      const m = me(s);
      if (!m) { pendingMe = null; if (view !== 'join') { unlockContinued = {}; rec = { step: 'pick', picks: [] }; renderJoin(); } return; }
      if (view === 'join' || view === 'idcard') return;         // don't yank someone mid-form
      if (view !== 'terminal') { renderTerminal(s); return; }
      header(s);
      const c = s.control;
      const key = MW.sceneKey(c) + ':' + c.phaseStartedAt + (c.revealed ? ':r' : '');
      if (key !== liveKey) {
        const first = liveKey === null; liveKey = key; sel = null;
        if (c.status === 'COMPLETED' && !s.registrations[m.id]) rec.step = rec.step === 'done' ? 'pick' : rec.step;
        if (tab === 'case') renderLive(s);
        else if (!first && ['VOTING', 'UNLOCK', 'COMPLETED'].includes(c.status) && !sheet) setTab('case');
        else { const b = root.querySelector('.pp-nav [data-tab="case"]'); b && b.classList.add('new'); if (!sheet) renderStatic(s); }
      } else {
        if (tab === 'case') liveTick();
        else if (!sheet) renderStatic(s);
      }
    }
    // first paint: returning investigators go straight into the terminal
    const s0 = MW.Store.get();
    if (MW.Me.get()) renderTerminal(s0); else renderJoin();
    const unsub = MW.Store.subscribe(render);
    const iv = setInterval(liveTick, 250);
    return { destroy() { unsub(); clearInterval(iv); root.innerHTML = ''; } };
  };
})();
